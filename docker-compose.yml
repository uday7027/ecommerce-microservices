services:

  # =========================
  # DATABASES
  # =========================

  auth-db:
    image: postgres:16
    container_name: auth-db
    environment:
      POSTGRES_DB: auth_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5433:5432"
    volumes:
      - auth-data:/var/lib/postgresql/data

  product-db:
    image: postgres:16
    container_name: product-db
    environment:
      POSTGRES_DB: product_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5434:5432"
    volumes:
      - product-data:/var/lib/postgresql/data

  order-db:
    image: postgres:16
    container_name: order-db
    environment:
      POSTGRES_DB: order_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5435:5432"
    volumes:
      - order-data:/var/lib/postgresql/data


  # =========================
  # EUREKA
  # =========================

  service-registry:
    build: ./service-registry
    container_name: service-registry
    ports:
      - "8761:8761"


  # =========================
  # AUTH SERVICE
  # =========================

  auth-service:
    build: ./auth-service
    container_name: auth-service
    ports:
      - "8081:8081"
    depends_on:
      - auth-db
      - service-registry


  # =========================
  # PRODUCT SERVICE
  # =========================

  product-service:
    build: ./product-service
    container_name: product-service
    ports:
      - "8082:8082"
    depends_on:
      - product-db
      - service-registry


  # =========================
  # ORDER SERVICE
  # =========================

  order-service:
    build: ./order-service
    container_name: order-service
    ports:
      - "8083:8083"
    depends_on:
      - order-db
      - service-registry
      - auth-service
      - product-service


  # =========================
  # API GATEWAY
  # =========================

  api-gateway:
    build: ./api-gateway
    container_name: api-gateway
    ports:
      - "8080:8080"
    depends_on:
      - service-registry
      - auth-service
      - product-service
      - order-service


# =========================
# VOLUMES
# =========================

volumes:
  auth-data:
  product-data:
  order-data: